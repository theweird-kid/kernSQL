name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  sanitize:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { preset: [asan, tsan] }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang
          CLANG_VER=$(clang --version | head -1 | grep -oP '(?<=version )\d+')
          sudo apt-get install -y "libc++-${CLANG_VER}-dev" "libc++abi-${CLANG_VER}-dev"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }}
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find src test -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
  source-list:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          missing=0
          for f in $(git ls-files 'src/*.cpp'); do
            if ! grep -qF "$f" CMakeLists.txt; then
              echo "::error::$f is tracked but not referenced in CMakeLists.txt"
              missing=1
            fi
          done
          exit "$missing"
