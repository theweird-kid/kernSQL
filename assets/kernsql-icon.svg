<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- KernSQL mark: the letter K drawn as a B+tree fragment.
       Vertical spine = root-to-leaf page chain; two diagonals = fanout to leaves.
       The junction node is filled gold: the kernel. -->
  <defs>
    <style>
      .edge { stroke:#5C6B7F; stroke-width:5; stroke-linecap:round; }
      .node { fill:#0F1722; stroke:#8EA0B5; stroke-width:4; }
      .kern { fill:#F2B33D; stroke:#F2B33D; stroke-width:4; }
    </style>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0F1722"/>

  <!-- edges (drawn first, under nodes) -->
  <line class="edge" x1="42" y1="26" x2="42" y2="102"/>
  <line class="edge" x1="42" y1="64" x2="92" y2="28"/>
  <line class="edge" x1="42" y1="64" x2="92" y2="100"/>

  <!-- page nodes -->
  <rect class="node" x="33" y="17"  width="18" height="18" rx="4"/>
  <rect class="node" x="33" y="93"  width="18" height="18" rx="4"/>
  <rect class="node" x="83" y="19"  width="18" height="18" rx="4"/>
  <rect class="node" x="83" y="91"  width="18" height="18" rx="4"/>

  <!-- the kernel -->
  <rect class="kern" x="31" y="53" width="22" height="22" rx="5"/>
</svg>
